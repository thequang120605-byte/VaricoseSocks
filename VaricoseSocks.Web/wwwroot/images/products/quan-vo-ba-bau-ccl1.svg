<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="maternityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2cfd9"/>
      <stop offset="50%" stop-color="#deb0be"/>
      <stop offset="100%" stop-color="#c991a2"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#bgGrad5)"/>
  
  <!-- Maternity Heart Badge -->
  <circle cx="50" cy="50" r="22" fill="#db2777" opacity="0.15"/>
  <path d="M50 58 C50 58, 38 48, 38 42 C38 38, 41 36, 44 36 C47 36, 49 38, 50 40 C51 38, 53 36, 56 36 C59 36, 62 38, 62 42 C62 48, 50 58, 50 58 Z" fill="#db2777"/>
  <text x="75" y="55" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#db2777">CHO MẸ BẦU THAI KỲ</text>

  <!-- Compression Pill -->
  <rect x="250" y="32" width="120" height="30" rx="15" fill="#db2777"/>
  <text x="310" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CCL1 (15-20 mmHg)</text>

  <!-- Maternity Pantyhose Body with Rounded Belly -->
  <g transform="translate(130, 70)">
    <!-- Soft Elastic Waistband -->
    <rect x="20" y="0" width="100" height="14" rx="4" fill="#be185d"/>
    
    <!-- Expanded Belly Pouch -->
    <path d="M20 14 C0 45, 0 85, 30 100 L70 102 L110 100 C135 85, 135 45, 120 14 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="2"/>
    
    <!-- Soft Elastic Support Band under belly -->
    <path d="M25 80 Q70 105 115 80" stroke="#db2777" stroke-width="4" fill="none"/>
    <text x="70" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#db2777" text-anchor="middle">ĐAI NÂNG BỤNG</text>
    <text x="70" y="73" font-family="Arial, sans-serif" font-size="8" fill="#9d174d" text-anchor="middle">Co giãn theo thai kỳ</text>

    <!-- Left Leg -->
    <path d="M30 100 C32 130, 30 190, 32 220 L60 220 C62 190, 64 150, 70 102 Z" fill="url(#maternityGrad)"/>
    <!-- Left Foot -->
    <path d="M32 220 C26 230, 22 245, 34 252 C46 258, 68 254, 82 244 L60 220 Z" fill="url(#maternityGrad)"/>

    <!-- Right Leg -->
    <path d="M70 102 C76 150, 78 190, 80 220 L108 220 C110 190, 108 130, 110 100 Z" fill="url(#maternityGrad)"/>
    <!-- Right Foot -->
    <path d="M80 220 L58 244 C72 254, 94 258, 106 252 C118 245, 114 230, 108 220 Z" fill="url(#maternityGrad)"/>
  </g>

  <!-- Left Callout -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="85" height="42" rx="8" fill="#ffffff" stroke="#fbcfe8"/>
    <text x="42" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#db2777" text-anchor="middle">NGỪA CHUỘT RÚT</text>
    <text x="42" y="32" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Giảm sưng phù chân</text>

    <rect x="0" y="55" width="85" height="42" rx="8" fill="#ffffff" stroke="#fbcfe8"/>
    <text x="42" y="72" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d6efd" text-anchor="middle">ÊM ÁI VÙNG BỤNG</text>
    <text x="42" y="88" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">Không bó thắt thai nhi</text>
  </g>

  <!-- Bottom Tag -->
  <rect x="20" y="340" width="360" height="42" rx="10" fill="#ffffff" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.06))"/>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">
    Quần Vớ Y Khoa Cho Mẹ Bầu RelaxSan Maternity CCL1
  </text>
</svg>
