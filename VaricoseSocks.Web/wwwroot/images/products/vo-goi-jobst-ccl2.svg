<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e1effe"/>
    </linearGradient>
    <linearGradient id="sockGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cbb1"/>
      <stop offset="50%" stop-color="#dfbc9d"/>
      <stop offset="100%" stop-color="#cb9f7c"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0dcaf0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#bgGrad1)"/>
  
  <!-- Medical Cross Badge -->
  <circle cx="50" cy="50" r="22" fill="#0d6efd" opacity="0.15"/>
  <path d="M46 38 h8 v8 h8 v8 h-8 v8 h-8 v-8 h-8 v-8 h8 z" fill="#0d6efd"/>
  <text x="80" y="55" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0d6efd">JOBST RELIEF USA</text>

  <!-- Compression Indicator Pill -->
  <rect x="250" y="32" width="120" height="30" rx="15" fill="#0d6efd"/>
  <text x="310" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CCL2 (20-30 mmHg)</text>

  <!-- Open Toe Knee-High Sock Body -->
  <g transform="translate(140, 75)">
    <!-- Top ribbed cuff -->
    <rect x="20" y="10" width="80" height="18" rx="4" fill="#c39470"/>
    <line x1="20" y1="16" x2="100" y2="16" stroke="#aa7953" stroke-width="2"/>
    <line x1="20" y1="22" x2="100" y2="22" stroke="#aa7953" stroke-width="2"/>

    <!-- Calf part -->
    <path d="M20 28 C10 80, 5 140, 25 190 C30 205, 30 220, 28 240 L70 240 C75 220, 78 200, 85 180 C95 130, 100 70, 100 28 Z" fill="url(#sockGrad1)"/>
    
    <!-- Heel & Foot (Open Toe) -->
    <path d="M28 240 C20 250, 15 270, 30 280 C50 290, 80 285, 120 270 C135 265, 140 255, 140 245 L130 230 C105 235, 80 238, 70 240 Z" fill="url(#sockGrad1)"/>
    
    <!-- Reinforced heel -->
    <path d="M28 240 C18 255, 25 275, 45 278 C35 265, 35 250, 42 240 Z" fill="#b98863"/>

    <!-- Open-toe band -->
    <path d="M128 230 L140 245 C142 248, 138 253, 132 255 L120 240 Z" fill="#c39470"/>
    <ellipse cx="145" cy="245" rx="5" ry="12" fill="none" stroke="#0d6efd" stroke-dasharray="3,3" stroke-width="2"/>

    <!-- Texture weave lines -->
    <path d="M25 100 Q60 110 95 100" stroke="#f5dfcc" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M23 130 Q60 140 93 130" stroke="#f5dfcc" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M24 160 Q60 170 88 160" stroke="#f5dfcc" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M26 190 Q55 198 84 190" stroke="#f5dfcc" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Compression Pressure Gradient Arrows -->
  <g transform="translate(60, 130)">
    <!-- 70% Calf -->
    <path d="M0 40 L30 40 M20 33 L30 40 L20 47" stroke="#0d6efd" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="-5" y="44" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d6efd" text-anchor="end">70% Áp lực</text>
    
    <!-- 100% Ankle -->
    <path d="M0 130 L30 130 M20 123 L30 130 L20 137" stroke="#dc3545" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="-5" y="134" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc3545" text-anchor="end">100% Cổ chân</text>
  </g>

  <!-- Bottom Tag -->
  <rect x="20" y="340" width="360" height="42" rx="10" fill="#ffffff" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.06))"/>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">
    Vớ Gối Y Khoa Jobst Relief - Hở Ngón (Màu Da)
  </text>
</svg>
